# Home server setup. Copy .env.example to .env, fill it in, then:  docker compose up -d --build
services:
  agent:
    build: .
    container_name: betiq-agent
    restart: unless-stopped
    environment:
      # The bet log: BETIQ_DB=/data/betiq.db keeps it on this server (shared with the web service
      # below). Without it the agent uses Supabase, as before.
      BETIQ_DB: ${BETIQ_DB:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      BETIQ_APP_URL: ${BETIQ_APP_URL:-}
      BETIQ_PAGE_CHECK_URL: ${BETIQ_PAGE_CHECK_URL:-http://web:8214/}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      BETIQ_MONTHLY_LIMIT: ${BETIQ_MONTHLY_LIMIT:-}
      TIPS_TOPIC: ${TIPS_TOPIC:-}
    volumes:
      - betiq-data:/data
      - ./backups:/backups      # nightly copies of the bet log, kept 30 days

  # The page and the bet log, at https://betiq.<domain> behind the home dashboard's login.
  # The deploy script copies the page into ./page.
  web:
    build: .
    container_name: betiq-web
    restart: unless-stopped
    command: ["python", "web.py"]
    environment:
      BIND: 0.0.0.0
      BETIQ_DB: /data/betiq.db
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
    ports:
      - 127.0.0.1:8214:8214     # only this server (the tunnel) can reach it
    volumes:
      - betiq-data:/data
      - ./page:/page:ro

  # Price watcher: opens the BetIQ page in a hidden browser every half hour so its own PLACE alert
  # works with the page closed. It spends Odds API credits, so it is only started when asked for:
  #   docker compose --profile watcher up -d --build
  watcher:
    build: ./watcher
    container_name: betiq-watcher
    restart: unless-stopped
    profiles: ["watcher"]
    init: true
    ipc: host
    environment:
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      BETIQ_LEAGUES: ${BETIQ_LEAGUES:-}
      BETIQ_BOOKS: ${BETIQ_BOOKS:-}
      BETIQ_WATCH_HOURS: ${BETIQ_WATCH_HOURS:-}
      BETIQ_MIN_CREDITS: ${BETIQ_MIN_CREDITS:-}
      BETIQ_KICKOFF: ${BETIQ_KICKOFF:-}
    volumes:
      - betiq-watch:/data

volumes:
  betiq-data:
  betiq-watch:
