name: BetIQ alerts
on:
  # Daily schedule is switched off for now. To turn alerts on later, add these two lines under "on:":
  #   schedule:
  #     - cron: "0 10 * * *"
  workflow_dispatch: {}     # lets you press "Run workflow" to test it
permissions:
  contents: read
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node alerts/check.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
