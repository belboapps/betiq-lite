<title>Trickle Down</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the game is a full-height column. A short scene strip where you walk through the years, a permanent pay-versus-bills gauge under it, then a lower panel that shows either the month counter or the crossroads cards. Title and result screens are one reading column. */
:root{
  --paper:#e6ecf2; --card:#f9fbfd; --ink:#14213d; --mute:#56637b; --rule:#c2cddb;
  --demand:#c8102e; --tab:#ffd400; --tabink:#14213d; --giro:#12715b; --gold:#f5b800; --heart:#d6336c; --fuel:#d9480f;
  --f-head:'Anton','Impact','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1524; --card:#172135; --ink:#e8edf4; --mute:#9aa7bf; --rule:#2b3954;
  --demand:#ff5d70; --tab:#ffd400; --tabink:#14213d; --giro:#4fd1a8; --gold:#ffc933; --heart:#ff6b9d; --fuel:#ff8a4c; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1524; --card:#172135; --ink:#e8edf4; --mute:#9aa7bf; --rule:#2b3954;
  --demand:#ff5d70; --tab:#ffd400; --tabink:#14213d; --giro:#4fd1a8; --gold:#ffc933; --heart:#ff6b9d; --fuel:#ff8a4c; color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--demand);outline-offset:2px}
.up{color:var(--giro)} .down{color:var(--demand)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.small{font-size:13px;color:var(--mute)}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* reading screens */
#app{max-width:620px;margin:0 auto;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.title{font-family:var(--f-head);font-size:clamp(64px,22vw,128px);line-height:.82;text-transform:uppercase;padding-top:28px}
.title i{font-style:normal;color:var(--demand);display:block}
.lede{font-size:18px;max-width:46ch}
.how{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.how .ic{font-size:30px;color:var(--ink)}
.chars{display:flex;flex-direction:column;gap:10px}
.char{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--ink);padding:12px 14px;border-radius:2px}
.char:hover{border-left-color:var(--demand)}
.char b{font-size:17px}
.char .pay{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-size:13px;color:var(--mute)}
.char .pay strong{display:block;font:600 18px var(--f-mono);color:var(--ink)}
.char span{color:var(--mute);font-size:14px;min-width:0}
.char.rich{border-left-color:var(--tab)}
.char[disabled]{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px}
.slip{border-top:2px dashed var(--rule)}
.lines{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;margin:0}
.lines .tot{border-top:1px solid var(--ink);padding-top:4px;font-weight:600}
.lines dt,.lines dd{margin:0}.lines dd{text-align:right}
.go{background:var(--ink);color:var(--card);border:0;border-radius:2px;padding:14px 18px;font-family:var(--f-head);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.ghost{background:transparent;border:1px solid var(--ink);border-radius:2px;padding:10px 14px;font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.stamp{font-family:var(--f-head);font-size:clamp(40px,12vw,72px);line-height:.9;text-transform:uppercase;color:var(--demand);border:5px solid var(--demand);padding:10px 14px;transform:rotate(-2deg);align-self:flex-start;margin-top:28px;text-wrap:balance}
.stamp.win{color:var(--giro);border-color:var(--giro)}
.share{font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px dashed var(--rule);padding:10px;-webkit-user-select:all;user-select:all;white-space:pre-wrap}
details.src{border-top:1px solid var(--rule);padding-top:10px}
details.src summary{cursor:pointer;font-weight:600}
details.src ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
details.src a{color:var(--ink)}
.idx{display:flex;flex-direction:column;gap:6px}
.idx-row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;font:600 12px var(--f-mono)}
.idx-bar{height:16px;background:var(--rule)} .idx-bar i{display:block;height:100%;background:var(--mute)}
.idx-bar i.hot{background:var(--demand)} .idx-bar i.pay{background:var(--giro)}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict div{border:1px solid var(--rule);background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.verdict b{font:400 38px var(--f-head);line-height:1}

/* the game */
#stage{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud .year{font-family:var(--f-head);font-size:40px;line-height:.9}
.hud .mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud .bank{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.hud .bank small{font:400 11px var(--f-body);color:var(--mute);margin-left:6px}
.bar{height:9px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--heart);transition:width .3s}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--card);font:600 11px var(--f-mono)}
.ticker{background:var(--tab);color:var(--tabink);font-weight:600;font-size:13px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block;flex:0 0 clamp(190px,36vh,330px);width:100%;touch-action:manipulation}
.gap{padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-block:2px solid var(--ink);display:flex;flex-direction:column;gap:6px;background:var(--card)}
.gr{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font:600 12px var(--f-mono)}
.gr .trk{height:18px;display:flex;background:var(--rule)}
.gr .trk i{display:block;height:100%}
.gr .val{font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.gr .val small{font:600 11px var(--f-mono)}
.gtail{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:400 11px var(--f-body);color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;background:var(--c)}
.pill{font:600 13px var(--f-mono);padding:2px 10px;border-radius:999px;border:2px solid currentColor}
.low{flex:1;min-height:0;overflow:auto;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.months i{height:8px;background:var(--rule)} .months i.on{background:var(--ink)}
.walkline{display:flex;justify-content:space-between;align-items:baseline}
.walkline b{font:400 30px var(--f-head);letter-spacing:.02em}
.low h2{font:400 28px/1 var(--f-head);text-transform:uppercase;text-wrap:balance}
.cards{display:grid;gap:8px}
.cards.n2{grid-template-columns:1fr 1fr} .cards.n3{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:2px;padding:8px;min-width:0;box-shadow:0 4px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .ic{font-size:28px}
.opt b{font-size:15px;line-height:1.15}
.opt .now{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--mute)}
.chips{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.chip{font:600 11px var(--f-mono);padding:1px 5px;border-radius:2px;background:var(--paper);color:var(--ink)}
.chip.bad{color:var(--demand)} .chip.good{color:var(--giro)}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>

<div id="app"></div>
<div id="stage" hidden>
  <div class="hud">
    <div class="year" id="hYear">2008</div>
    <div class="mid"><div class="bank" id="hBank">£0</div><div class="bar" aria-label="Wellbeing"><i id="hHeart" style="width:70%"></i></div></div>
    <button class="icon-btn" id="mute" type="button" aria-label="Toggle sound">SND</button>
  </div>
  <div class="ticker" id="hTick"></div>
  <canvas id="cv" aria-label="You walking through the years. Tap and hold to hurry."></canvas>
  <div class="gap" id="gap"></div>
  <div class="low" id="low"></div>
</div>

<script>
(() => {
/*DATA-START*/
// Every array runs 2008..2025. "direct" in a source note means the figures were read from the publisher's own series for this build.
const RENT_IDX = [84.8,86.3,87.5,89.7,92.7,95.0,97.2,100.0,101.8,102.7,103.2,103.9,105.4,107.2,110.9,117.3,125.7,132.5];
const ENERGY_IDX = [74.9,80.2,77.9,85.7,92.5,99.1,103.4,100.0,97.0,100.7,107.5,111.6,106.5,111.5,183.6,212.0,172.2,174.9];
const AWE_WEEKLY = [434,434,444,455,461,466,471,482,494,505,520,538,547,580,616,659,694,728];
const DATA = {
  pay: AWE_WEEKLY.map(w => w * 52),
  minWage:[5.52,5.73,5.80,5.93,6.08,6.19,6.31,6.50,7.20,7.50,7.83,8.21,8.72,8.91,9.50,10.42,11.44,12.21],
  cpi:[84.7,86.6,89.4,93.4,96.1,98.5,100.0,100.0,100.7,103.4,105.9,107.8,108.7,111.6,121.7,130.5,133.9,138.4],
  food:[83.5,88.1,91.1,96.0,99.1,102.9,102.7,100.0,97.6,99.8,101.8,103.2,103.9,104.2,115.5,132.3,135.8,141.5],
  rent: RENT_IDX.map(i => 1368 * i / 132.5),          // pounds a month, anchored to the ONS UK average private rent
  energy: ENERGY_IDX.map(i => 2252 * i / 172.2),      // pounds a year, anchored to the DESNZ 2024 typical dual-fuel bill
  house:[162912,148445,156936,154654,155269,159262,172048,182291,195035,203950,210354,212434,218522,236313,258236,258956,260532,267458],
  ceo:[null,null,null,null,null,null,null,3970000,3450000,3930000,3630000,3610000,2690000,3410000,3910000,4190000,4580000,5060000],
  pa:[6035,6475,6475,7475,8105,9440,10000,10600,11000,11500,11850,12500,12500,12570,12570,12570,12570,12570],
  hr:[40835,43875,43875,42475,42475,41450,41865,42385,43000,45000,46350,50000,50000,50270,50270,50270,50270,50270],
  pt:[5435,5715,5715,7225,7605,7755,7956,8060,8060,8164,8424,8632,9500,9568,11908,12570,12570,12570],
  ni:[.11,.11,.11,.12,.12,.12,.12,.12,.12,.12,.12,.12,.12,.12,.1273,.115,.08,.08],
  uel:[40040,43875,43875,42475,42475,41450,41865,42385,43000,45000,46350,50000,50000,50270,50270,50270,50270,50270],
  ni2:[.01,.01,.01,.02,.02,.02,.02,.02,.02,.02,.02,.02,.02,.02,.0273,.02,.02,.02],
  freezeUntil: 2030,
  base: { food:185, essentials:200, bus:75 },   // 2008 pounds a month, one adult; illustrative
  sources: [
    {title:'ONS Consumer Prices Index: all items (D7BT) and food (D7BU)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7bt/mm23', note:'Annual averages, read direct.'},
    {title:'ONS CPI: actual rents for housing (D7CE)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7ce/mm23', note:'Read direct. Turned into pounds using the ONS UK average private rent of £1,368 (December 2025). This index includes social rents and existing tenancies, so it understates how fast new private rents rose.'},
    {title:'ONS CPI: electricity, gas and other fuels (D7CH)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7ch/mm23', note:'Read direct. Turned into pounds using the government’s typical 2024 dual-fuel bill of £2,252, a figure since revised by about 1.5%.'},
    {title:'ONS Average Weekly Earnings, total pay (KAB9)', url:'https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/timeseries/kab9/emp', note:'Read direct. Sam is paid this average, times 52.'},
    {title:'GOV.UK National Minimum Wage and National Living Wage rates', url:'https://www.gov.uk/national-minimum-wage-rates', note:'Main adult rate in force for most of each year. Statutory rates, not re-checked against the page for this build.'},
    {title:'GOV.UK income tax and National Insurance rates and allowances', url:'https://www.gov.uk/government/publications/rates-and-allowances-income-tax/income-tax-rates-and-allowances-current-and-past', note:'Statutory rates for England, Wales and Northern Ireland, not re-checked for this build. Mid-year changes in 2022 and 2023 are averaged. Thresholds are announced as frozen until April 2031.'},
    {title:'UK House Price Index (HM Land Registry and ONS)', url:'https://www.gov.uk/government/collections/uk-house-price-index-reports', note:'Annual averages taken from a third-party compilation of the official index, not read direct.'},
    {title:'High Pay Centre annual FTSE 100 chief executive pay reports', url:'https://highpaycentre.org/', note:'Median total pay as first reported. 2018 and 2019 read direct; other years from the reports via press coverage; 2017 unverified. No verified figures before 2015, so boss comparisons start then.'}
  ]
};
/*DATA-END*/

const Y0 = 2008, YN = Y0 + DATA.pay.length - 1, YEND = 2040;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? '−' : '') + '£' + Math.abs(Math.round(n)).toLocaleString('en-GB');
const signed = n => (n < 0 ? '−' : '+') + '£' + Math.abs(Math.round(n)).toLocaleString('en-GB');
const big = n => Math.abs(n) >= 1e6 ? (n < 0 ? '−' : '') + '£' + (Math.abs(n) / 1e6).toFixed(Math.abs(n) >= 1e7 ? 0 : 1) + 'm' : money(n);
const arrow = n => (n >= 0 ? '▲' : '▼') + Math.abs(n * 100).toFixed(1) + '%';
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// A series value for any year. After the last real year, each series carries on at its own average growth rate.
function v(key, y){
  const s = DATA[key];
  let last = s.length - 1, first = 0; while (s[last] == null) last--; while (s[first] == null) first++;
  if (y - Y0 <= last) return s[y - Y0];
  const g = Math.pow(s[last] / s[first], 1 / (last - first));
  return s[last] * Math.pow(g, y - Y0 - last);
}
const idx = (key, y) => v(key, y) / v(key, Y0);
const minWage = y => y <= YN ? v('minWage', y) : v('minWage', YN) * v('pay', y) / v('pay', YN);   // after 2025 it keeps its share of average pay
function threshold(key, y){
  if (y <= YN) return DATA[key][y - Y0];
  const lastV = DATA[key][YN - Y0];
  return y <= DATA.freezeUntil ? lastV : lastV * v('cpi', y) / v('cpi', DATA.freezeUntil);
}
function taxOn(g, y){
  const pa = threshold('pa', y), hr = threshold('hr', y), pt = threshold('pt', y), uel = threshold('uel', y);
  const k = Math.min(y, YN) - Y0;
  const top = y >= 2010 ? (y >= 2013 ? .45 : .5) : .4, topAt = y >= 2023 ? 125140 : 150000;
  const allow = g > 100000 && y >= 2010 ? Math.max(0, pa - (g - 100000) / 2) : pa;
  const it = .2 * Math.max(0, Math.min(g, hr) - allow) + .4 * Math.max(0, Math.min(g, topAt) - Math.max(hr, allow)) + top * Math.max(0, g - topAt);
  const ni = DATA.ni[k] * Math.max(0, Math.min(g, uel) - pt) + DATA.ni2[k] * Math.max(0, g - uel);
  return it + ni;
}

// ---- icons: simple line drawings, 24 by 24 -----------------------------
const ICON = {
  wrench:'<path d="M15 4a5 5 0 0 0-4.5 6.8L3.5 17.8 6 20.3l7-7A5 5 0 0 0 20 8.800l-3 3-2.500-.8-.8-2.500z"/>',
  flame:'<path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  snow:'<path d="M12 3v18M4.500 7.500l15 9M19.500 7.500l-15 9"/>',
  tooth:'<path d="M7 4c-3 0-3 5-1 8 1 3 1 8 3 8s1-5 3-5 1 5 3 5 2-5 3-8c2-3 2-8-1-8-3 0-3 2-5 2S10 4 7 4z"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  bus:'<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M7 20v-3M17 20v-3"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',
  cart:'<path d="M3 4h3l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.500"/><circle cx="17" cy="19" r="1.500"/>',
  heart:'<path d="M12 20s-8-5-8-11a4.500 4.500 0 0 1 8-2 4.500 4.500 0 0 1 8 2c0 6-8 11-8 11z"/>',
  pint:'<path d="M6 4h10l-1 16H7zM16 8h3v6h-3"/>',
  plane:'<path d="M2 14l20-8-8 16-3-7z"/>',
  book:'<path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2"/><path d="M20 5v13h-7"/>',
  coins:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.500 9.500c0-2 5-2 5 0s-5 2-5 4 5 2 5 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  drop:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
  bike:'<circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8H8"/>',
  people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.500"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 1.500 6 5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/>',
  no:'<circle cx="12" cy="12" r="9"/><path d="M5.500 5.500l13 13"/>',
  up:'<path d="M12 20V5M6 11l6-6 6 6"/>',
  key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4"/>',
  bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  yacht:'<path d="M3 17h18l-3 4H6zM12 3v12M12 4l7 10h-7"/>',
  crown:'<path d="M3 8l5 4 4-7 4 7 5-4-2 11H5z"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>',
  gift:'<rect x="4" y="10" width="16" height="10"/><path d="M12 10v10M3 7h18v3H3zM12 7c-3-4-6-1-4 0M12 7c3-4 6-1 4 0"/>',
  bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
  bed:'<path d="M3 18V8M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6"/>',
  fork:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>'
};
const ico = (n, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || ICON.coins) + '</svg>';

// ---- persistent bits -------------------------------------------------
let meta = {unlocked:false, best:{}, mute:false};
try { Object.assign(meta, JSON.parse(localStorage.getItem('trickle-down') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('trickle-down', JSON.stringify(meta)); } catch (e) {} };
let ac;
function beep(f, d, type, vol, slide){
  if (meta.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, n + d);
    g.gain.setValueAtTime(vol || .04, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(n + d);
  } catch (e) {}
}

const W = 400, CX = 110, DY = 430, WALK_T = 6.5;
let H = 260, scale = 1, dpr = 1, C = {};

const cv = $('cv'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rich = () => !!CH[S.ck].rich;

function resize(){
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = r.width / W; H = r.height / scale;
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['paper','card','ink','mute','rule','demand','tab','tabink','giro','gold','heart','fuel']) C[k] = cs.getPropertyValue('--' + k).trim();
}
addEventListener('resize', resize);

// The money for one year, built from the data and what you have chosen so far.
function yearMoney(y){
  const ch = CH[S.ck], ci = idx('cpi', y), m = S.m;
  const gross = ch.gross(y) * m.pay, net = gross - taxOn(gross, y);
  if (ch.rich){ const yacht = 360000 * ci; return {gross, net, ci, rent:0, energy:0, food:0, rest:yacht, bills:yacht}; }
  const home = HOMES[S.set.home], heat = HEATS[S.set.heat], fd = FOODS[S.set.food];
  const rent = v('rent', y) * home.rent * m.rent * 12, energy = v('energy', y) * home.en * heat.f * m.energy;
  const food = B.food * idx('food', y) * fd.f * m.food * 12, rest = ((B.essentials * home.ess + B.bus) * m.rest + m.fixed) * ci * 12;
  return {gross, net, ci, rent, energy, food, rest, bills:rent + energy + food + rest};
}
const wbPerYear = () => rich() ? 0 : HOMES[S.set.home].wb + HEATS[S.set.heat].wb + FOODS[S.set.food].wb + (-4) + S.m.wbyr + (S.bal < 0 ? -4 : 0);
const limitFor = y => yearMoney(y).net / 4;      // three months of take-home pay

function newGame(ck){
  const ch = CH[ck];
  S = {ck, year:ch.y0 || Y0, bal:ch.start, wb:70, dist:0, signX:CX + 130, set:{home:ch.home, heat:1, food:1}, livedHome:ch.home,
       m:{pay:1, rent:1, energy:1, food:1, rest:1, fixed:0, wbyr:0, isa:0}, perks:[], perkUsed:[], owed:0, used:[], q:null,
       earned:0, giles:0, gYears:0, hist:[], over:null, last:null};
  G = null; $('app').hidden = true; $('stage').hidden = false; resize(); showCross(); scrollTo(0, 0);
}

function makeQuestion(){
  const n = S.year - startYear(), y = S.year;
  if (rich()){
    let i; do { i = Math.floor(Math.random() * RICH_EVENTS.length); } while (S.used.includes('r' + i) && S.used.length < RICH_EVENTS.length); S.used.push('r' + i);
    return Object.assign({kind:'event'}, RICH_EVENTS[i]);
  }
  if (n === 0) return Object.assign({kind:'setting'}, SETTINGS[0]);
  const slot = n % 4;
  if (slot === 2 && S.perkUsed.length < PERKS.length - 1){
    const pool = PERKS.map((p, i) => i).filter(i => !S.perkUsed.includes(i)), id = pool[Math.floor(Math.random() * pool.length)], p = PERKS[id];
    S.perkUsed.push(id);
    return {kind:'chance', t:p.name, sub:p.line, ic:p.ic, opts:[{l:'Take it', ic:p.ic, cost:p.cost, wb:p.wb, wbyr:p.wbyr, eff:p.eff, perk:p.name}, {l:'Not now', ic:'no'}]};
  }
  if (slot === 0) return Object.assign({kind:'setting'}, SETTINGS[(n / 4 - 1) % 3]);
  let i; do { i = Math.floor(Math.random() * EVENTS.length); } while (S.used.includes(i) && S.used.length < EVENTS.length); S.used.push(i);
  if (S.used.length >= EVENTS.length) S.used = [];
  return Object.assign({kind:'event'}, EVENTS[i]);
}

// What a card shows underneath its name: money first, then the heart.
function chipsFor(q, o, i){
  const y = S.year, ci = idx('cpi', y), k = rich() ? 1 : ci, c = [];
  const add = (t, cls) => c.push('<span class="chip ' + (cls || '') + '">' + t + '</span>');
  if (q.kind === 'setting'){
    const it = q.list[i], m = S.m;
    let mo;
    if (q.k === 'home') mo = v('rent', y) * it.rent * m.rent; else if (q.k === 'heat') mo = v('energy', y) * HOMES[S.set.home].en * it.f * m.energy / 12; else mo = B.food * idx('food', y) * it.f * m.food;
    add(money(mo) + '/mo');
    if (q.k === 'home' && i !== S.livedHome && !rich()) add('+' + money(350 * ci) + ' move', 'bad');
    if (it.wb) add('♥ ' + (it.wb > 0 ? '+' : '−') + Math.abs(it.wb) + '/yr', it.wb < 0 ? 'bad' : 'good');
    return c.join('');
  }
  if (o.cost) add(money(-o.cost * k), 'bad');
  if (o.gain) add('+' + big(o.gain * k), 'good');
  if (o.rent) add('rent ▲' + Math.round((o.rent - 1) * 100) + '% for good', 'bad');
  if (o.later) add('repay ' + money(o.later * k) + ' next year', 'bad');
  if (o.luck) add('a gamble');
  if (o.eff){
    const e = o.eff;
    if (e.pay) add('pay ▲' + Math.round((e.pay - 1) * 100) + '% for good', 'good');
    if (e.rent < 1) add('rent ▼' + Math.round((1 - e.rent) * 100) + '%', 'good'); if (e.energy) add('energy ▼10%', 'good');
    if (e.food) add('food ▼10%', 'good'); if (e.rest) add('other bills ▼10%', 'good'); if (e.isa) add('2% on savings', 'good');
    if (e.fixed) add(money(e.fixed) + ' a month', 'bad');
  }
  if (o.wb) add('♥ ' + (o.wb > 0 ? '+' : '−') + Math.abs(o.wb), o.wb < 0 ? 'bad' : 'good');
  if (o.wbyr) add('♥ −1 every year', 'bad');
  return c.join('');
}

function showCross(){
  const q = S.q = makeQuestion(), y = S.year;
  const opts = q.kind === 'setting' ? q.list.map(it => ({l:it.n, ic:it.ic})) : q.opts;
  const cur = q.kind === 'setting' ? S.set[q.k] : -1;
  let h = '<p class="eyebrow">' + (S.last ? S.last.year + ': ' + signed(S.last.diff) + ' · ' : '') + y + ' ahead</p><h2>' + q.t + '</h2><p class="small">' + q.sub + '</p>' +
    '<div class="cards n' + opts.length + '">' + opts.map((o, i) =>
      '<button class="opt" id="o-' + i + '" type="button">' + ico(o.ic) + '<b>' + o.l + '</b>' + (i === cur ? '<span class="now">NOW</span>' : '') + '<span class="chips">' + chipsFor(q, o, i) + '</span></button>').join('') + '</div>';
  $('low').innerHTML = h; $('low').scrollTop = 0;
  opts.forEach((o, i) => $('o-' + i).addEventListener('click', () => choose(i)));
  $('hTick').textContent = HEADLINES[y]; refreshGap(); hud();
}

function choose(i){
  if (!S || G || !S.q) return;
  const q = S.q, y = S.year, ci = idx('cpi', y), k = rich() ? 1 : ci; S.q = null;
  let banner = q.t;
  if (q.kind === 'setting'){
    if (q.k === 'home' && i !== S.livedHome && !rich()){ S.bal -= 350 * ci; banner += ': moved'; }
    S.set[q.k] = i; if (q.k === 'home') S.livedHome = i; banner = q.list[i].n;
  } else {
    const o = q.opts[i];
    if (o.cost){ S.bal -= o.cost * k; banner += ': ' + money(-o.cost * k); }
    if (o.gain){ S.bal += o.gain * k; banner += ': +' + big(o.gain * k); }
    if (o.wb) S.wb = Math.max(rich() ? 50 : 0, Math.min(100, S.wb + o.wb));
    if (o.rent) S.m.rent *= o.rent;
    if (o.later) S.owed = o.later * k;
    if (o.wbyr) S.m.wbyr += o.wbyr;
    if (o.luck){
      if (Math.random() < o.luck.p){ S.m.pay *= o.luck.pay; banner = o.luck.win; } else { S.wb = Math.max(0, S.wb + o.luck.loseWb); banner = o.luck.lose; }
    }
    if (o.eff){ const e = o.eff; for (const key of ['pay', 'rent', 'energy', 'food', 'rest']) if (e[key]) S.m[key] *= e[key]; if (e.fixed) S.m.fixed += e.fixed; if (e.isa) S.m.isa = 1; S.perks.push(o.perk); banner = o.perk; }
    if (o.l === 'Not now') banner = 'Walked on';
  }
  beep(520, .1, 'triangle', .04, 1.4);
  if (!rich() && S.bal < -limitFor(y)){
    S.over = {kind:'bust', month:1, cause:q.t.toLowerCase()}; S.bal = -limitFor(y);
    G = {t:0, T:WALK_T, done:true, overT:1.2, mi:0, pops:[], sprites:[], M:yearMoney(y), limit:limitFor(y), dist0:S.dist, fast:false, banner:null, bannerT:0, shake:10, pre:true}; $('low').innerHTML = ''; return;
  }
  startWalk(banner);
}

// ---- walking ---------------------------------------------------------
function startWalk(banner){
  const y = S.year, M = yearMoney(y);
  S.signX = S.dist + DY + 130;
  G = {t:0, T:WALK_T, mi:0, fast:false, M, limit:limitFor(y), dist0:S.dist, pops:[], sprites:[], banner, bannerT:3, done:false, overT:0, shake:0, from:S.bal, wb0:S.wb, tickLine:0};
  if (S.owed){ S.bal -= S.owed; G.banner = (banner ? banner + ' · ' : '') + 'Loan repaid ' + money(-S.owed); S.owed = 0; }
  const ceo = v('ceo', y);
  G.lines = [HEADLINES[y]];
  if (!rich() && ceo){ const d = new Date(y, 0, 1 + Math.floor(365 / (ceo / M.gross))); G.lines.push('The median FTSE 100 boss made ' + big(ceo) + '. That covered your whole year by ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '.'); }
  G.lines.push('The average house costs ' + money(v('house', y)) + ': ' + (v('house', y) / M.gross).toFixed(1) + ' times your pay.');
  $('hTick').textContent = G.lines[0];
  renderLow(); refreshGap(); hud();
}
function monthTick(){
  const M = G.M, sick = !rich() && S.wb < 30, net = M.net / 12 * (sick ? .96 : 1);
  let out = M.bills / 12; if (S.bal < 0) out += -S.bal * .25 / 12;
  S.bal += net - out; S.earned += net;
  if (!rich()) S.wb = Math.max(0, Math.min(100, S.wb + wbPerYear() / 12)); else S.wb = 100;
  G.sprites.push({k:'coin', u:0, big:net}, {k:'env', u:0, size:Math.max(.7, Math.min(2.2, out / Math.max(1, net)))});
  G.mi++; beep(700 + G.mi * 25, .05, 'sine', .025);
  if (!rich() && S.bal < -G.limit){ S.over = {kind:'bust', month:G.mi, cause:'the bills'}; S.bal = -G.limit; endRun(); }
  else if (!rich() && S.wb <= 0){ S.over = {kind:'burnout', month:G.mi, cause:'going without for too long'}; endRun(); }
  hud(); renderMonths();
}
function endRun(){ G.done = true; G.overT = 1.3; G.shake = 12; beep(200, .5, 'sawtooth', .05, .3); }

function update(dt){
  if (!S) return;
  if (G){
    for (const p of G.sprites) p.u += dt / .9;
    G.sprites = G.sprites.filter(p => p.u < 1);
    G.shake = Math.max(0, G.shake - dt * 30); G.bannerT -= dt;
    if (G.done){ G.overT -= dt; if (G.overT <= 0) finishYear(); return; }
    dt *= G.fast ? 3.2 : 1;
    G.t += dt; S.dist = G.dist0 + Math.min(1, G.t / G.T) * DY;
    const per = G.T * .85 / 12;
    while (G.mi < 12 && !G.done && G.t >= (G.mi + 1) * per) monthTick();
    const li = Math.floor(G.t / 2.6) % G.lines.length; if (li !== G.tickLine){ G.tickLine = li; $('hTick').textContent = G.lines[li]; }
    if (G.t >= G.T && !G.done) finishYear();
  }
}

function finishYear(){
  const y = S.year, M = G && G.M || yearMoney(y);
  S.hist.push({y, pay:M.net / 12, bills:M.bills / 12});
  S.giles += v('ceo', y) || 0; if (v('ceo', y)) S.gYears++;
  const from = G && G.from != null ? G.from : S.bal;
  if (!S.over){
    if (S.m.isa && S.bal > 0) S.bal *= 1.02;
    if (rich()) S.bal *= v('house', y + 1) / v('house', y);
    S.last = {year:y, diff:S.bal - from};
    if (y >= YEND) S.over = {kind:'survived'};
  }
  G = null;
  if (S.over){
    meta.unlocked = true;
    const yrs = y - startYear() + (S.over.kind === 'survived' ? 1 : 0);
    meta.best[S.ck] = Math.max(meta.best[S.ck] || 0, yrs); persist();
    $('stage').hidden = true; $('app').hidden = false; renderEnd(); scrollTo(0, 0);
  } else { S.year++; showCross(); }
}

// ---- drawing ---------------------------------------------------------
function layer(par, spacing, fn){
  const off = S.dist * par, k0 = Math.floor(off / spacing) - 1, n = Math.ceil(W / spacing) + 3;
  for (let k = k0; k < k0 + n; k++) fn(k * spacing - off, k);
}
function draw(){

  const y = S.year, gy = H - 40, dist = S.dist;
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  ctx.translate(G && G.shake && !reduceMotion ? (Math.random() - .5) * G.shake * .4 : 0, 0);

  ctx.fillStyle = C.gold; ctx.fillRect(tx, gy - th, 40, th);
  ctx.fillStyle = C.ink; for (let r = 0; r < th - 14; r += 11) for (let c = 0; c < 3; c++) ctx.fillRect(tx + 6 + c * 11, gy - th + 18 + r, 6, 5);
  ctx.fillStyle = C.ink; ctx.fillRect(tx - 3, gy - th - 14, 46, 14);

    const w = 78, h = 58 + hash(s + 5) * 22, top = gy - h;
    ctx.fillStyle = C.card; ctx.fillRect(x, top, w, h); ctx.strokeStyle = C.rule; ctx.lineWidth = 2; ctx.strokeRect(x, top, w, h);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(x - 5, top); ctx.lineTo(x + w / 2, top - 18); ctx.lineTo(x + w + 5, top); ctx.closePath(); ctx.fill();
    ctx.fillStyle = hash(s + 9) > .5 ? C.tab : C.rule; ctx.fillRect(x + 10, top + 12, 14, 14); ctx.fillRect(x + w - 24, top + 12, 14, 14);
    ctx.fillStyle = C.fuel; ctx.fillRect(x + w / 2 - 6, gy - 26, 12, 26);
    const m = ((s % 3) + 3) % 3;
    if (m < 2){                                   // a real price on a sign: rents and house prices for this year
      ctx.fillStyle = C.ink; ctx.fillRect(x + w + 4, gy - 46, 3, 46);
      ctx.fillStyle = m === 0 ? C.demand : C.giro; ctx.fillRect(x + w + 7, gy - 50, 58, 30);
      ctx.fillStyle = C.card; ctx.textAlign = 'center'; ctx.font = '600 8px "IBM Plex Mono", monospace'; ctx.fillText(m === 0 ? 'TO LET' : 'FOR SALE', x + w + 36, gy - 40);
      ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.fillText(m === 0 ? rentTxt : houseTxt, x + w + 36, gy - 27);
    }
  });

  ctx.fillStyle = C.rule; ctx.fillRect(-10, gy, W + 20, 40);
  ctx.fillStyle = C.mute; layer(1, 52, x => ctx.fillRect(x, gy + 18, 24, 3));
  layer(1, 170, (x, s) => { ctx.fillStyle = C.ink; ctx.fillRect(x, gy - 74, 3, 74); ctx.fillRect(x - 6, gy - 78, 15, 5); ctx.fillStyle = C.tab; ctx.fillRect(x - 4, gy - 73, 11, 3); });

    ctx.fillStyle = C.ink; ctx.fillRect(sx - 2, gy - 74, 5, 74);
    ctx.fillStyle = C.tab; ctx.fillRect(sx - 22, gy - 92, 44, 28); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(sx - 22, gy - 92, 44, 28);
    ctx.fillStyle = C.tabink; ctx.font = '400 24px Anton, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', sx, gy - 69);
  }

        ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(x, yy, 6, 0, 6.2832); ctx.fill(); ctx.fillStyle = '#5c4200'; ctx.font = '600 8px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.fillText('£', x, yy + 3);

    ctx.fillStyle = C.rule; ctx.fillRect(34, 16, W - 68, 4); ctx.fillStyle = C.ink; ctx.fillRect(34, 16, (W - 68) * pr, 4);
    ctx.beginPath(); ctx.arc(34 + (W - 68) * pr, 18, 6, 0, 6.2832); ctx.fill();
    ctx.fillStyle = C.mute; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.fillText(sy0, 4, 22); ctx.textAlign = 'right'; ctx.fillText(YEND, W - 4, 22);
    if (G.bannerT > 0 && G.banner){
      ctx.globalAlpha = Math.min(1, G.bannerT); ctx.fillStyle = C.tab; ctx.fillRect(10, 36, W - 20, 28);
      ctx.fillStyle = C.tabink; ctx.font = '400 17px Anton, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(G.banner.toUpperCase().slice(0, 44), W / 2, 56); ctx.globalAlpha = 1;
    }
    if (S.over && G.done){
      ctx.save(); ctx.translate(W / 2, H * .45); ctx.rotate(-.06); ctx.fillStyle = C.demand; ctx.font = '400 50px Anton, Impact, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(S.over.kind === 'bust' ? 'CREDIT GONE' : 'BURNT OUT', 0, 0); ctx.restore();
    }
  }
}
function drawFigure(gy){
  const ch = CH[S.ck], walking = G && !G.done, ph = S.dist * .1, bob = walking ? Math.abs(Math.sin(ph * 2)) * 2 : 0, sw = walking ? Math.sin(ph * 2) * 7 : 0;
  const low = !rich() && S.wb < 30, slump = low ? 3 : 0;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX - 3, gy - 18 - bob); ctx.lineTo(CX - 3 + sw, gy); ctx.moveTo(CX + 3, gy - 18 - bob); ctx.lineTo(CX + 3 - sw, gy); ctx.stroke();
  ctx.fillStyle = low ? C.mute : ch.col; ctx.fillRect(CX - 9, gy - 48 - bob + slump, 18, 32);
  ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(CX + slump * .5, gy - 56 - bob + slump, 8, 0, 6.2832); ctx.fill();
  if (S.set.heat === 0 && !rich()){ ctx.fillStyle = C.demand; ctx.fillRect(CX - 10, gy - 49 - bob + slump, 20, 5); }
  if (rich()){ ctx.fillStyle = C.gold; ctx.fillRect(CX - 7, gy - 68 - bob, 14, 6); }
  if (S.bal < 0 && !rich()){
    const t = performance.now() / 1000;
    ctx.fillStyle = C.mute; ctx.beginPath(); ctx.ellipse(CX, gy - 86, 24, 10, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = C.demand; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++){ const o = (t * 40 + i * 9) % 16; ctx.beginPath(); ctx.moveTo(CX + i * 12, gy - 78 + o); ctx.lineTo(CX + i * 12 - 2, gy - 72 + o); ctx.stroke(); }
  }
}

// ---- reading screens -------------------------------------------------
function sourcesHTML(){
  const li = DATA.sources.map(s => '<li><a href="' + s.url + '" target="_blank" rel="noopener">' + s.title + '</a>. ' + s.note + '</li>').join('');
  return '<details class="src"><summary>Where the numbers come from</summary><ul>' + li +
    '<li>How the figures become the game: your pay and your bills each month are that year’s published figures, shaped by the choices you made.</li>' +
    '<li>People, companies and headlines are invented. Pay, prices, rents, bills and tax rules for ' + Y0 + ' to ' + YN + ' come from the sources above; each note says how closely it was checked.</li>' +
    '<li>Years after ' + YN + ' are a projection, not a forecast: each series simply carries on at its own average rate since ' + Y0 + ', except the minimum wage, which keeps its 2025 share of average pay.</li>' +
    '<li>Simplified: one adult, no children, no benefits or pension, renting privately. Housing sizes, everyday costs, the café’s accounts, the yacht, the life events and the perks are illustrative, not data.</li></ul></details>';

function renderStart(){
  const rows = [['Pay', v('pay', YN) / v('pay', Y0), 'pay'], ['Food', idx('food', YN), ''], ['Rent', idx('rent', YN), ''], ['House', v('house', YN) / v('house', Y0), ''], ['Energy', idx('energy', YN), 'hot']];

  }).join('');
  $('app').innerHTML =
    '<h1 class="title">Trickle <i>Down</i></h1>' +

    '<div class="how">' + ico('coins') + '<span><b>Pay comes in, bills go out,</b> every month. The gap decides how long you last.</span>' +
    ico('key') + '<span><b>A signpost every year.</b> Pick a path. Everything costs money or wellbeing.</span>' +
    ico('crown') + '<span><b>The boss gets richer</b> in the background. Look up.</span></div>' +

const rank = yrs => yrs < 5 ? 'Official verdict: should have budgeted better.' : yrs < 12 ? 'Official verdict: just about managing.' : yrs < 24 ? 'Official verdict: resilient, the government’s favourite word.' : 'Official verdict: so close to the nothing waiting at the end.';
function chartHTML(){
  const h = S.hist; if (h.length < 2) return '';
  const w = 360, ht = 150, px = 34, max = Math.max(...h.flatMap(d => [d.pay, d.bills])) * 1.1;
  const X = i => px + i * (w - px - 10) / (h.length - 1), Y = val => ht - 22 - val / max * (ht - 36);
  const line = key => h.map((d, i) => X(i).toFixed(1) + ',' + Y(d[key]).toFixed(1)).join(' ');
  let gaps = ''; for (let i = 0; i < h.length - 1; i++) if (h[i].bills > h[i].pay && h[i + 1].bills > h[i + 1].pay)
    gaps += '<polygon points="' + X(i) + ',' + Y(h[i].bills) + ' ' + X(i + 1) + ',' + Y(h[i + 1].bills) + ' ' + X(i + 1) + ',' + Y(h[i + 1].pay) + ' ' + X(i) + ',' + Y(h[i].pay) + '" fill="var(--demand)" opacity=".28"/>';

    '<text x="' + px + '" y="' + (ht - 6) + '" fill="var(--mute)" font-size="10" font-family="IBM Plex Mono, monospace">' + h[0].y + '</text><text x="' + (w - 10) + '" y="' + (ht - 6) + '" text-anchor="end" fill="var(--mute)" font-size="10" font-family="IBM Plex Mono, monospace">' + h[h.length - 1].y + '</text>' +
    '<text x="' + (px - 4) + '" y="12" text-anchor="end" fill="var(--mute)" font-size="10" font-family="IBM Plex Mono, monospace">' + big(max / 1.1) + '</text>' +
    '<text x="' + (w - 10) + '" y="12" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace"><tspan fill="var(--giro)">pay</tspan> <tspan fill="var(--demand)">bills</tspan></text></svg>';
}
function renderEnd(){
  const ch = CH[S.ck], o = S.over, y = S.year, first = ch.rich ? 'Sir Giles' : ch.name, art = /^[aeiou]/i.test(ch.job) ? 'an' : 'a';

      '<dt class="tot">Years ' + first + ' would need to work for that</dt><dd class="tot">' + Math.round(gTot / (Math.max(1, S.earned) / yrs)).toLocaleString('en-GB') + '</dd></dl></section>') +
    '<section class="card"><p class="eyebrow">Tell someone</p><p class="share" id="share">' + share + '</p><div class="btns"><button class="ghost" id="copy" type="button">Copy result</button></div></section>' +
    '<div class="btns"><button class="go" id="again" type="button">Play again</button>' + (ch.rich ? '' : '<button class="ghost" id="asgiles" type="button">Now play as the boss</button>') + '</div>' + sourcesHTML();
  $('again').addEventListener('click', () => { S = null; renderStart(); scrollTo(0, 0); });
  if (!ch.rich) $('asgiles').addEventListener('click', () => newGame('giles'));
  $('copy').addEventListener('click', () => {

}

addEventListener('pointerup', () => { if (G) G.fast = false; });
addEventListener('keydown', e => {
  if (e.code === 'Space' && G && !(e.target instanceof HTMLButtonElement)){ e.preventDefault(); G.fast = true; }
  if (S && S.q && /^Digit[1-3]$/.test(e.code)){ const i = +e.code.slice(5) - 1, n = S.q.kind === 'setting' ? S.q.list.length : S.q.opts.length; if (i < n) choose(i); }
});
addEventListener('keyup', e => { if (e.code === 'Space' && G) G.fast = false; });
$('mute').addEventListener('click', () => { meta.mute = !meta.mute; persist(); $('mute').textContent = meta.mute ? 'OFF' : 'SND'; });
$('mute').textContent = meta.mute ? 'OFF' : 'SND';

let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (S && !window.__tdManual) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__td = {v, idx, taxOn, CH, W, get S(){ return S; }, get G(){ return G; }, newGame, choose, update, yearMoney, HOMES, HEATS, FOODS};
renderStart();
})();
