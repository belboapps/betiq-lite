<title>Trickle Down</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the game is one full-height play column (max 520px): HUD strip, yellow ticker, then the canvas. Title and result screens are a single reading column of paperwork. */
:root{
  --paper:#e6ecf2; --card:#f9fbfd; --ink:#14213d; --mute:#56637b; --rule:#c2cddb;
  --demand:#c8102e; --tab:#ffd400; --tabink:#14213d; --giro:#12715b; --gold:#f5b800; --heart:#d6336c; --fuel:#d9480f;
  --f-head:'Anton','Impact','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1524; --card:#172135; --ink:#e8edf4; --mute:#9aa7bf; --rule:#2b3954;
  --demand:#ff5d70; --tab:#ffd400; --tabink:#14213d; --giro:#4fd1a8; --gold:#ffc933; --heart:#ff6b9d; --fuel:#ff8a4c; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1524; --card:#172135; --ink:#e8edf4; --mute:#9aa7bf; --rule:#2b3954;
  --demand:#ff5d70; --tab:#ffd400; --tabink:#14213d; --giro:#4fd1a8; --gold:#ffc933; --heart:#ff6b9d; --fuel:#ff8a4c; color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--demand);outline-offset:2px}
.up{color:var(--giro)} .down{color:var(--demand)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.small{font-size:13px;color:var(--mute)}

/* reading screens */
#app{max-width:620px;margin:0 auto;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.title{font-family:var(--f-head);font-size:clamp(64px,22vw,128px);line-height:.82;text-transform:uppercase;padding-top:28px}
.title i{font-style:normal;color:var(--demand);display:block}
.lede{font-size:17px;max-width:52ch}
.chars{display:flex;flex-direction:column;gap:10px}
.char{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--ink);padding:12px 14px;border-radius:2px}
.char:hover{border-left-color:var(--demand)}
.char b{font-size:17px}
.char .pay{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-size:13px;color:var(--mute)}
.char .pay strong{display:block;font:600 18px var(--f-mono);color:var(--ink)}
.char span{color:var(--mute);font-size:14px;min-width:0}
.char.rich{border-left-color:var(--tab)}
.char[disabled]{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px}
.slip{border-top:2px dashed var(--rule)}
.lines{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;margin:0}
.lines .tot{border-top:1px solid var(--ink);padding-top:4px;font-weight:600}
.lines dt,.lines dd{margin:0}.lines dd{text-align:right}
.go{background:var(--ink);color:var(--card);border:0;border-radius:2px;padding:14px 18px;font-family:var(--f-head);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.ghost{background:transparent;border:1px solid var(--ink);border-radius:2px;padding:10px 14px;font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.stamp{font-family:var(--f-head);font-size:clamp(40px,12vw,72px);line-height:.9;text-transform:uppercase;color:var(--demand);border:5px solid var(--demand);padding:10px 14px;transform:rotate(-2deg);align-self:flex-start;margin-top:28px;text-wrap:balance}
.stamp.win{color:var(--giro);border-color:var(--giro)}
.share{font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px dashed var(--rule);padding:10px;-webkit-user-select:all;user-select:all;white-space:pre-wrap}
details.src{border-top:1px solid var(--rule);padding-top:10px}
details.src summary{cursor:pointer;font-weight:600}
details.src ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
details.src a{color:var(--ink)}

/* the game */
#stage{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud .year{font-family:var(--f-head);font-size:40px;line-height:.9}
.hud .mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud .bank{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--heart)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--card);font:600 11px var(--f-mono)}
.ticker{background:var(--tab);color:var(--tabink);font-weight:600;font-size:13px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block;flex:1;min-height:0;width:100%;touch-action:none}
.inter{position:absolute;inset:0;background:var(--paper);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inter .big{font-family:var(--f-head);font-size:88px;line-height:.85}
.proj{display:inline-block;background:var(--demand);color:var(--card);font:600 10px var(--f-body);letter-spacing:.12em;padding:2px 6px;text-transform:uppercase;align-self:flex-start}
.head{background:var(--tab);color:var(--tabink);font-weight:600;padding:8px 10px}
.gauge{display:flex;flex-direction:column;gap:8px}
.g-row{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font:600 12px var(--f-mono)}
.g-bar{height:26px;display:flex;align-items:center;padding:0 8px;color:var(--card);white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums}
.g-bar.pay{background:var(--giro)} .g-bar.bills{background:var(--demand)} .g-bar.boss{background:var(--gold);color:var(--tabink)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.lg{width:38px;height:24px;display:grid;place-items:center;font:600 11px var(--f-mono);border-radius:3px;justify-self:center}
.lg.coin{background:var(--gold);color:var(--tabink);border-radius:50%;width:26px;height:26px}
.lg.bill{background:var(--ink);color:var(--card)}
.lg.red{background:var(--demand);color:var(--card)}
.lg.hrt{color:var(--heart);font-size:26px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perk{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--giro);border-radius:2px;padding:10px;min-width:0}
.perk b{font-size:15px}
.perk span{font-size:13px;color:var(--mute)}
.perk em{font:600 12px var(--f-mono);font-style:normal}
.perk[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.perk[aria-pressed="true"] span{color:var(--card)}
</style>

<div id="app"></div>
<div id="stage" hidden>
  <div class="hud">
    <div class="year" id="hYear">2008</div>
    <div class="mid"><div class="bank" id="hBank">£0</div><div class="bar" aria-label="Wellbeing"><i id="hHeart" style="width:70%"></i></div></div>
    <button class="icon-btn" id="mute" type="button" aria-label="Toggle sound">SND</button>
  </div>
  <div class="ticker" id="hTick"></div>
  <canvas id="cv" aria-label="Play area: move left and right to catch falling pay and bills"></canvas>
  <div class="inter" id="inter" hidden></div>
</div>

<script>
(() => {
/*DATA-START*/
// Every array runs 2008..2025. "direct" in a source note means the figures were read from the publisher's own series for this build.
const RENT_IDX = [84.8,86.3,87.5,89.7,92.7,95.0,97.2,100.0,101.8,102.7,103.2,103.9,105.4,107.2,110.9,117.3,125.7,132.5];
const ENERGY_IDX = [74.9,80.2,77.9,85.7,92.5,99.1,103.4,100.0,97.0,100.7,107.5,111.6,106.5,111.5,183.6,212.0,172.2,174.9];
const AWE_WEEKLY = [434,434,444,455,461,466,471,482,494,505,520,538,547,580,616,659,694,728];
const DATA = {
  pay: AWE_WEEKLY.map(w => w * 52),
  minWage:[5.52,5.73,5.80,5.93,6.08,6.19,6.31,6.50,7.20,7.50,7.83,8.21,8.72,8.91,9.50,10.42,11.44,12.21],
  cpi:[84.7,86.6,89.4,93.4,96.1,98.5,100.0,100.0,100.7,103.4,105.9,107.8,108.7,111.6,121.7,130.5,133.9,138.4],
  food:[83.5,88.1,91.1,96.0,99.1,102.9,102.7,100.0,97.6,99.8,101.8,103.2,103.9,104.2,115.5,132.3,135.8,141.5],
  rent: RENT_IDX.map(i => 1368 * i / 132.5),          // pounds a month, anchored to the ONS UK average private rent
  energy: ENERGY_IDX.map(i => 2252 * i / 172.2),      // pounds a year, anchored to the DESNZ 2024 typical dual-fuel bill
  house:[162912,148445,156936,154654,155269,159262,172048,182291,195035,203950,210354,212434,218522,236313,258236,258956,260532,267458],
  ceo:[null,null,null,null,null,null,null,3970000,3450000,3930000,3630000,3610000,2690000,3410000,3910000,4190000,4580000,5060000],
  pa:[6035,6475,6475,7475,8105,9440,10000,10600,11000,11500,11850,12500,12500,12570,12570,12570,12570,12570],
  hr:[40835,43875,43875,42475,42475,41450,41865,42385,43000,45000,46350,50000,50000,50270,50270,50270,50270,50270],
  pt:[5435,5715,5715,7225,7605,7755,7956,8060,8060,8164,8424,8632,9500,9568,11908,12570,12570,12570],
  ni:[.11,.11,.11,.12,.12,.12,.12,.12,.12,.12,.12,.12,.12,.12,.1273,.115,.08,.08],
  uel:[40040,43875,43875,42475,42475,41450,41865,42385,43000,45000,46350,50000,50000,50270,50270,50270,50270,50270],
  ni2:[.01,.01,.01,.02,.02,.02,.02,.02,.02,.02,.02,.02,.02,.02,.0273,.02,.02,.02],
  freezeUntil: 2030,
  base: { food:165, essentials:175, bus:50, pint:30, holiday:320 },   // 2008 pounds, one adult; illustrative
  sources: [
    {title:'ONS Consumer Prices Index: all items (D7BT) and food (D7BU)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7bt/mm23', note:'Annual averages, read direct.'},
    {title:'ONS CPI: actual rents for housing (D7CE)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7ce/mm23', note:'Read direct. Turned into pounds using the ONS UK average private rent of £1,368 (December 2025). This index includes social rents and existing tenancies, so it understates how fast new private rents rose.'},
    {title:'ONS CPI: electricity, gas and other fuels (D7CH)', url:'https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7ch/mm23', note:'Read direct. Turned into pounds using the government’s typical 2024 dual-fuel bill of £2,252, a figure since revised by about 1.5%.'},
    {title:'ONS Average Weekly Earnings, total pay (KAB9)', url:'https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/timeseries/kab9/emp', note:'Read direct. Sam is paid this average, times 52.'},
    {title:'GOV.UK National Minimum Wage and National Living Wage rates', url:'https://www.gov.uk/national-minimum-wage-rates', note:'Main adult rate in force for most of each year. Statutory rates, not re-checked against the page for this build.'},
    {title:'GOV.UK income tax and National Insurance rates and allowances', url:'https://www.gov.uk/government/publications/rates-and-allowances-income-tax/income-tax-rates-and-allowances-current-and-past', note:'Statutory rates for England, Wales and Northern Ireland, not re-checked for this build. Mid-year changes in 2022 and 2023 are averaged. Thresholds are announced as frozen until April 2031.'},
    {title:'UK House Price Index (HM Land Registry and ONS)', url:'https://www.gov.uk/government/collections/uk-house-price-index-reports', note:'Annual averages taken from a third-party compilation of the official index, not read direct.'},
    {title:'High Pay Centre annual FTSE 100 chief executive pay reports', url:'https://highpaycentre.org/', note:'Median total pay as first reported. 2018 and 2019 read direct; other years from the reports via press coverage; 2017 unverified. No verified figures before 2015, so boss comparisons start then.'}
  ]
};
/*DATA-END*/

const Y0 = 2008, YN = Y0 + DATA.pay.length - 1, YEND = 2040;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? '−' : '') + '£' + Math.abs(Math.round(n)).toLocaleString('en-GB');
const signed = n => (n < 0 ? '−' : '+') + '£' + Math.abs(Math.round(n)).toLocaleString('en-GB');
const big = n => Math.abs(n) >= 1e6 ? (n < 0 ? '−' : '') + '£' + (Math.abs(n) / 1e6).toFixed(Math.abs(n) >= 1e7 ? 0 : 1) + 'm' : money(n);
const pct = n => (n >= 0 ? '▲' : '▼') + Math.abs(n * 100).toFixed(1) + '%';
const rnd = (a, b) => a + Math.random() * (b - a);

// A series value for any year. After the last real year, each series carries on at its own average growth rate.
function v(key, y){
  const s = DATA[key];
  let last = s.length - 1, first = 0; while (s[last] == null) last--; while (s[first] == null) first++;
  if (y - Y0 <= last) return s[y - Y0];
  const g = Math.pow(s[last] / s[first], 1 / (last - first));
  return s[last] * Math.pow(g, y - Y0 - last);
}
const idx = (key, y) => v(key, y) / v(key, Y0);
function threshold(key, y){               // tax thresholds: real values, then frozen, then rising with prices
  if (y <= YN) return DATA[key][y - Y0];
  const lastV = DATA[key][YN - Y0];
  return y <= DATA.freezeUntil ? lastV : lastV * v('cpi', y) / v('cpi', DATA.freezeUntil);
}
function taxOn(g, y){
  const pa = threshold('pa', y), hr = threshold('hr', y), pt = threshold('pt', y), uel = threshold('uel', y);
  const k = Math.min(y, YN) - Y0;
  const top = y >= 2010 ? (y >= 2013 ? .45 : .5) : .4, topAt = y >= 2023 ? 125140 : 150000;
  const allow = g > 100000 && y >= 2010 ? Math.max(0, pa - (g - 100000) / 2) : pa;
  const it = .2 * Math.max(0, Math.min(g, hr) - allow) + .4 * Math.max(0, Math.min(g, topAt) - Math.max(hr, allow)) + top * Math.max(0, g - topAt);
  const ni = DATA.ni[k] * Math.max(0, Math.min(g, uel) - pt) + DATA.ni2[k] * Math.max(0, g - uel);
  return it + ni;
}

// After the last real year the minimum wage keeps its share of average pay, rather than racing ahead of it.
const minWage = y => y <= YN ? v('minWage', y) : v('minWage', YN) * v('pay', y) / v('pay', YN);

// ---- cast (all fictional) -------------------------------------------
const B = DATA.base;
const CH = {
  dee:  {name:'Dee', job:'Care worker', blurb:'Minimum wage, room in a shared house. Hard.', start:300, home:{rent:.38, en:.4, ess:.7},
         gross:y => minWage(y) * 37.5 * 52},
  sam:  {name:'Sam', job:'Office administrator', blurb:'The national average wage, one-bed flat.', start:1500, home:{rent:.8, en:.7, ess:1},
         gross:y => v('pay', y)},
  priya:{name:'Priya', job:'Café owner', blurb:'A small business. Her costs rise before her prices can.', start:1000, home:{rent:.8, en:.7, ess:1},
         gross:y => Math.max(0, 78000 * idx('cpi', y) - minWage(y) * 37.5 * 52 * 1.1 - 14000 * idx('rent', y) - 6000 * idx('energy', y) - 22000 * idx('food', y))},
  giles:{name:'Sir Giles Hoard-Whittle', job:'Chief executive, OmniGrab plc', blurb:'The real median pay of a FTSE 100 boss. Starts in 2015. Easy.', start:2000000, rich:true, y0:2015,
         gross:y => v('ceo', y)}
};
const HAZARDS = [['BOILER', 180], ['DENTIST', 220], ['PHONE', 190], ['MOULD', 130], ['TAXI', 120], ['WASHER', 250], ['FINE', 100], ['VET', 160], ['RENT HIKE', 0]];
const PERKS = [
  {name:'Night school', line:'Pay +6% for good', cost:450, wb:-10, eff:{pay:1.06}},
  {name:'Take a lodger', line:'Rent −20%. Tires you 10% faster', eff:{rent:.8, drain:1.1}},
  {name:'Join the union', line:'Pay +3%. Subs £12 a month', eff:{pay:1.03, fixed:12}},
  {name:'Cheaper town', line:'Rent −15%. You miss everyone', cost:900, wb:-15, eff:{rent:.85}},
  {name:'A bike', line:'Other bills −10%', cost:150, eff:{rest:.9}},
  {name:'Draught-proofing', line:'Energy −10%', cost:90, eff:{energy:.9}},
  {name:'Overtime', line:'Wider bucket. Tires you 15% faster', eff:{bucket:1.3, drain:1.15}},
  {name:'Cooking club', line:'Food −10%', eff:{food:.9}},
  {name:'Savings account', line:'2% a year on what you keep', eff:{isa:1}}
];
const HEADLINES = {
  2008:'Northern Crock bank rescued with public money. Bonuses "contractual".',
  2009:'Interest rates cut to the floor. Savers told to "think positive".',
  2010:'Chancellor Tightbelt: "We are all in this together."',
  2011:'Public sector pay frozen. Boardroom pay left out to thaw.',
  2012:'Top rate of tax trimmed "to lift morale".',
  2013:'Payday lender WongaWonga sponsors a football shirt.',
  2014:'Recovery declared. Check behind the sofa for yours.',
  2015:'Zero-hours contracts rebranded "flexi-freedom".',
  2016:'Referendum held. Pound falls. Imports cost more.',
  2017:'Minister: no magic money tree. Tree later found for other things.',
  2018:'Rail fares rise again. Trains remain theoretical.',
  2019:'The Daily Blame: "Why can\'t the young stop buying coffee?"',
  2020:'Nation claps for carers. Landlords do not accept claps.',
  2021:'Shelves empty in supply crisis. Yachts unaffected.',
  2022:'EnergiSqueeze posts record profit: "cuddle a pet for warmth".',
  2023:'Mortgage rates jump. Landlords pass it on with a sad emoji.',
  2024:'Tidewater Utilities raises bills to fix what it did not fix.',
  2025:'Tax thresholds frozen. Part of your pay rise goes straight back.',
  2026:'Government launches Help to Rent a Shed.',
  2027:'OmniGrab trials a subscription for the staff toilets.',
  2028:'First-time buyer, 61, makes the front page.',
  2029:'Minister suggests the young try "having wealthier parents".',
  2030:'Avocado toast cleared after a 15-year inquiry.',
  2031:'Heating reclassified as a luxury good.',
  2032:'Landlord of the Year: "most creative use of a cupboard".',
  2033:'OmniGrab acquires the weather. Rain now Premium.',
  2034:'Retirement age raised to "we will let you know".',
  2035:'National clap for renters announced.',
  2036:'Bus route replaced by a motivational poster.',
  2037:'Sir Giles knighted again, for services to Sir Giles.',
  2038:'Economists: wealth will trickle down "any decade now".',
  2039:'Lord Hoard-Whittle unveils a personal moon.',
  2040:'Official report: people "could have budgeted better".'
};

// ---- persistent bits -------------------------------------------------
let meta = {unlocked:false, best:{}, mute:false};
try { Object.assign(meta, JSON.parse(localStorage.getItem('trickle-down') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('trickle-down', JSON.stringify(meta)); } catch (e) {} };
let ac;
function beep(f, d, type, vol, slide){
  if (meta.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, n + d);
    g.gain.setValueAtTime(vol || .05, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(n + d);
  } catch (e) {}
}

// ---- game state ------------------------------------------------------
const W = 400;                           // logical play width; height follows the screen
let H = 560, scale = 1, dpr = 1, C = {};
let S = null;                            // the run: survives from year to year
let G = null;                            // the year being played
const cv = $('cv'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rich = () => !!CH[S.ck].rich;
const startYear = () => CH[S.ck].y0 || Y0;

function resize(){
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = r.width / W; H = r.height / scale;
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['paper','card','ink','mute','rule','demand','tab','tabink','giro','gold','heart','fuel']) C[k] = cs.getPropertyValue('--' + k).trim();
}
addEventListener('resize', resize);

// The year's money, from the data. Everything the canvas drops is built from this.
function yearMoney(y){
  const ch = CH[S.ck], ci = idx('cpi', y), m = S.m;
  const gross = ch.gross(y) * m.pay, net = gross - taxOn(gross, y);
  if (ch.rich) return {gross, net, ci, rent:0, energy:0, food:0, rest:90000 * ci * 4, bills:90000 * ci * 4};
  const rent = v('rent', y) * ch.home.rent * m.rent * 12, energy = v('energy', y) * ch.home.en * .8 * m.energy;
  const food = B.food * idx('food', y) * m.food * 12, rest = ((B.essentials * ch.home.ess + B.bus) * m.rest + m.fixed) * ci * 12;
  return {gross, net, ci, rent, energy, food, rest, bills:rent + energy + food + rest};
}

function setupYear(){
  const y = S.year, r = rich(), M = yearMoney(y), T = r ? 7 : 14;
  const fall = Math.max(1.55, 2.5 - .03 * (y - Y0)), span = T - .4, q = [];
  const add = (t, o) => q.push(Object.assign({t, x:rnd(34, W - 34)}, o));
  const coins = 24, coinVal = M.net / coins;
  for (let i = 0; i < coins; i++) add((i + rnd(.2, .8)) / coins * span, {k:'coin', val:coinVal});
  const bill = (label, val, n, tone) => { for (let i = 0; i < n; i++) add((i + rnd(.25, .75)) / n * span, {k:'bill', label, val:val / n, tone}); };
  if (r){
    bill('YACHT', M.rest, 4, 'ink');
    for (let i = 0; i < 2; i++) add(rnd(.5, span), {k:'bonus', label:'BONUS', val:rnd(4, 9) * 1e5});
  } else {
    bill('RENT', M.rent, 6, 'ink'); bill('ENERGY', M.energy, 2, 'fuel'); bill('FOOD', M.food, 2, 'giro'); bill('BILLS', M.rest, 2, 'mute');
    if (S.bal < 0) add(rnd(1, span - 1), {k:'bill', label:'INTEREST', val:-S.bal * .25, tone:'demand'});
    const nh = 1 + Math.min(3, Math.floor((y - Y0) / 7));
    for (let i = 0; i < nh; i++){
      const h = HAZARDS[Math.floor(Math.random() * HAZARDS.length)];
      const near = q[Math.floor(Math.random() * coins)];                 // half the red letters shadow a pay coin
      const o = {k:'haz', label:h[0], val:h[1] * M.ci};
      if (Math.random() < .5) q.push(Object.assign({t:near.t + .05, x:Math.max(34, Math.min(W - 34, near.x + (Math.random() < .5 ? -58 : 58)))}, o));
      else add(rnd(.5, span), o);
    }
    for (let i = 0; i < 3; i++) add((i + rnd(.3, .7)) / 3 * span, {k:'treat', label:'PINT', val:B.pint * M.ci, gain:9});
    if ((y - startYear()) % 2 === 1) add(rnd(2, span - 1), {k:'treat', label:'HOLIDAY', val:B.holiday * M.ci, gain:30, bigT:true});
  }
  q.sort((a, b) => a.t - b.t);
  return {t:0, T, fall, q, objs:[], pops:[], M, coinVal, limit:M.net / 4, px:W / 2, cw:r ? W * .86 : 84 * S.m.bucket,
          from:S.bal, late:0, missed:0, done:false, overT:0, shake:0, key:0};
}

const catchY = () => H - 52, floorY = () => H - 14;
function pop(x, y, text, tone){ G.pops.push({x:Math.max(60, Math.min(W - 60, x)), y, text, tone, life:1.1}); }
function charge(amount, label){           // money leaves; this is where a run can end
  S.bal -= amount; S.lastHit = label;
  if (!rich() && S.bal < -G.limit && !S.over){
    S.over = {kind:'bust', month:Math.min(12, Math.floor(G.t / G.T * 12) + 1), cause:label};
    S.bal = -G.limit; endRun();
  }
}
function endRun(){ G.done = true; G.overT = 1.3; G.shake = 14; beep(200, .5, 'sawtooth', .06, .3); }

function caught(o){
  const y = catchY();
  if (o.k === 'coin'){ const val = o.val * (S.wb < 30 && !rich() ? .96 : 1); S.bal += val; S.earned += val; beep(880, .06, 'sine', .04, 1.3); }
  else if (o.k === 'bonus'){ S.bal += o.val; pop(o.x, y - 20, '+' + big(o.val), 'gold'); beep(660, .2, 'sine', .06, 2); }
  else if (o.k === 'bill'){ pop(o.x, y - 20, money(-o.val), 'ink'); beep(300, .07, 'triangle', .04); charge(o.val, o.label === 'BILLS' ? 'the bills' : 'the ' + o.label.toLowerCase()); }
  else if (o.k === 'haz'){
    G.shake = 8; beep(140, .25, 'square', .05, .6);
    if (o.label === 'RENT HIKE'){ S.m.rent *= 1.05; pop(o.x, y - 20, 'RENT +5% FOR GOOD', 'demand'); }
    else { pop(o.x, y - 20, o.label + ' ' + money(-o.val), 'demand'); S.wb = Math.max(0, S.wb - 4); charge(o.val, 'the ' + o.label.toLowerCase()); }
  }
  else if (o.k === 'treat'){ S.wb = Math.min(100, S.wb + o.gain); pop(o.x, y - 20, o.label + ' ' + money(-o.val), 'heart'); beep(520, .18, 'sine', .05, 1.5); charge(o.val, 'a ' + o.label.toLowerCase()); }
}
function dropped(o){
  if (o.k === 'bill'){
    G.late++; S.wb = Math.max(0, S.wb - 3); G.shake = 5;
    pop(o.x, floorY() - 26, 'LATE FEE ' + money(-o.val * .1), 'demand'); beep(180, .2, 'sawtooth', .04, .7);
    charge(o.val * 1.1, 'a late fee');
  } else if (o.k === 'coin') G.missed++;
}

function update(dt){
  if (!G) return;
  for (const p of G.pops){ p.y -= 28 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);
  G.shake = Math.max(0, G.shake - dt * 30);
  if (G.done){ G.overT -= dt; if (G.overT <= 0) afterYear(); return; }
  G.t += dt;
  if (G.key) G.px = Math.max(0, Math.min(W, G.px + G.key * 560 * dt));
  while (G.q.length && G.q[0].t <= G.t){ const o = G.q.shift(); o.y = 62; G.objs.push(o); }
  const vy = (catchY() - 62) / G.fall, cy = catchY();
  for (const o of G.objs){
    const was = o.y; o.y += vy * dt;
    const half = G.cw / 2 + (o.k === 'bill' ? 14 : o.k === 'haz' ? 2 : 8);
    if (was < cy + 6 && o.y >= cy - 10 && Math.abs(o.x - G.px) < half){ o.gone = true; caught(o); }
    else if (o.y > floorY()){ o.gone = true; dropped(o); }
    if (G.done) return;
  }
  G.objs = G.objs.filter(o => !o.gone);
  if (!rich()){
    S.wb = Math.max(0, S.wb - 20 / G.T * S.m.drain * dt);
    if (S.wb <= 0){ S.over = {kind:'burnout', month:Math.min(12, Math.floor(G.t / G.T * 12) + 1), cause:'going without for too long'}; endRun(); return; }
  }
  if (!G.q.length && !G.objs.length && G.t >= G.T - 1){ G.done = true; G.overT = 0; }
}

function afterYear(){
  const y = S.year;
  S.giles += v('ceo', y) || 0; if (v('ceo', y)) S.gYears++;
  if (!S.over){
    if (S.m.isa && S.bal > 0) S.bal *= 1.02;
    if (rich()) S.bal *= v('house', y + 1) / v('house', y);
    S.last = {year:y, diff:S.bal - G.from, late:G.late, missed:G.missed};
    if (y >= YEND) S.over = {kind:'survived'};
  }
  G = null;
  if (S.over){
    meta.unlocked = true;
    const yrs = y - startYear() + (S.over.kind === 'survived' ? 1 : 0);
    meta.best[S.ck] = Math.max(meta.best[S.ck] || 0, yrs); persist();
    $('stage').hidden = true; $('app').hidden = false; renderEnd(); scrollTo(0, 0);
  } else { S.year++; interlude(); }
}

// ---- drawing ---------------------------------------------------------
function heartPath(x, y, s){
  ctx.beginPath(); ctx.moveTo(x, y + s * .9);
  ctx.bezierCurveTo(x - s * 1.5, y - s * .1, x - s * .7, y - s * 1.1, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .7, y - s * 1.1, x + s * 1.5, y - s * .1, x, y + s * .9); ctx.closePath();
}
function draw(){
  if (!G || !C.paper) return;
  const k = dpr * scale; ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  const sx = G.shake && !reduceMotion ? rnd(-G.shake, G.shake) * .4 : 0; ctx.translate(sx, 0);
  const y = S.year, r = rich(), ceo = v('ceo', y);

  // the vault at the top, where the money goes first
  ctx.fillStyle = C.ink; ctx.fillRect(-10, 0, W + 20, 56);
  const stacks = Math.min(18, 5 + Math.floor((y - Y0) / 2));
  for (let i = 0; i < stacks; i++){
    const hgt = 3 + ((i * 7) % 5) + Math.floor((y - Y0) / 5), bx = 12 + i * 9;
    for (let j = 0; j < hgt; j++){ ctx.fillStyle = j % 2 ? '#d99e00' : C.gold; ctx.fillRect(bx, 50 - j * 4, 7, 3); }
  }
  ctx.textAlign = 'right'; ctx.fillStyle = C.gold; ctx.font = '400 20px Anton, Impact, sans-serif';
  ctx.fillText(r ? 'YOUR VAULT' : 'THE BOSS', W - 12, 24);
  ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.fillStyle = C.card;
  ctx.fillText(r ? big(S.bal) : ceo ? big(ceo) + ' = ' + Math.round(ceo / G.M.gross) + ' of you' : 'keeps the rest', W - 12, 43);

  // the year as twelve months
  for (let m = 0; m < 12; m++){
    ctx.fillStyle = m < G.t / G.T * 12 ? C.mute : C.rule; ctx.fillRect(4 + m * (W - 8) / 12, 58, (W - 8) / 12 - 2, 3);
  }

  for (const o of G.objs){
    ctx.textAlign = 'center';
    if (o.k === 'coin' || o.k === 'bonus'){
      const rr = o.k === 'bonus' ? 18 : 12;
      ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(o.x, o.y, rr, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = '#a87900'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(o.x, o.y, rr - 3, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = '#5c4200'; ctx.font = '600 ' + (rr + 1) + 'px "IBM Plex Mono", monospace'; ctx.fillText('£', o.x, o.y + rr * .4);
    } else if (o.k === 'bill'){
      const w = Math.max(54, Math.min(128, 40 + 11 * o.val / G.coinVal)), h = 34;   // wider envelope, bigger bill
      ctx.fillStyle = C[o.tone]; ctx.fillRect(o.x - w / 2, o.y - h / 2, w, h);
      ctx.strokeStyle = C.paper; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(o.x - w / 2, o.y - h / 2); ctx.lineTo(o.x, o.y - 6); ctx.lineTo(o.x + w / 2, o.y - h / 2); ctx.stroke();
      ctx.fillStyle = C.paper; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillText(o.label, o.x, o.y + 4);
      ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.fillText(money(o.val), o.x, o.y + 15);
    } else if (o.k === 'haz'){
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(Math.sin(G.t * 9 + o.x) * .14);
      ctx.fillStyle = C.demand; ctx.fillRect(-24, -16, 48, 32);
      ctx.strokeStyle = C.paper; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-24, -16); ctx.lineTo(0, 2); ctx.lineTo(24, -16); ctx.stroke();
      ctx.fillStyle = C.paper; ctx.font = '400 20px Anton, Impact, sans-serif'; ctx.fillText('!', 0, 13); ctx.restore();
    } else if (o.k === 'treat'){
      const s = o.bigT ? 17 : 11; ctx.fillStyle = C.heart; heartPath(o.x, o.y, s); ctx.fill();
      ctx.fillStyle = C.ink; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.fillText(money(o.val), o.x, o.y + s + 13);
    }
  }

  // you and your bucket
  const cy = catchY(), cw = G.cw, debt = S.bal < 0;
  ctx.fillStyle = debt ? C.demand : C.ink;
  ctx.beginPath(); ctx.moveTo(G.px - cw / 2, cy); ctx.lineTo(G.px + cw / 2, cy); ctx.lineTo(G.px + cw / 2 - 9, cy + 30); ctx.lineTo(G.px - cw / 2 + 9, cy + 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.gold; ctx.fillRect(G.px - cw / 2 - 3, cy - 3, cw + 6, 5);
  ctx.fillStyle = C.paper; ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
  ctx.fillText(r ? 'YACHT' : CH[S.ck].name.toUpperCase(), G.px, cy + 21);
  ctx.fillStyle = C.rule; ctx.fillRect(-10, floorY(), W + 20, 2);
  if (!r){ ctx.fillStyle = C.demand; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.fillText('CREDIT LIMIT ' + money(-G.limit), 6, H - 2); }

  for (const p of G.pops){
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.textAlign = 'center';
    ctx.font = '600 13px "IBM Plex Mono", monospace'; ctx.fillStyle = C[p.tone] || C.ink; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (S.over && G.done){
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.06);
    ctx.fillStyle = C.demand; ctx.font = '400 54px Anton, Impact, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(S.over.kind === 'bust' ? 'CREDIT GONE' : 'BURNT OUT', 0, 0); ctx.restore();
  }
}
function hud(){
  $('hYear').textContent = S.year;
  const b = $('hBank'); b.textContent = big(S.bal); b.className = 'bank ' + (S.bal < 0 ? 'down' : '');
  $('hHeart').style.width = (rich() ? 100 : S.wb) + '%';
}

// ---- between years ---------------------------------------------------
function applyEff(e){
  for (const k of ['pay', 'rent', 'energy', 'food', 'rest', 'drain', 'bucket']) if (e[k]) S.m[k] *= e[k];
  if (e.fixed) S.m.fixed += e.fixed; if (e.isa) S.m.isa = 1;
}
function interlude(){
  const y = S.year, ch = CH[S.ck], first = y === startYear(), M = yearMoney(y), ci = M.ci;
  const prev = first ? null : yearMoney(y - 1);
  S.offer = null; S.pick = null;
  if (!ch.rich && !first && (y - startYear()) % 2 === 0 && S.perkUsed.length < PERKS.length - 1){
    const pool = PERKS.map((p, i) => i).filter(i => !S.perkUsed.includes(i));
    const a = pool.splice(Math.floor(Math.random() * pool.length), 1)[0], b = pool[Math.floor(Math.random() * pool.length)];
    S.offer = [a, b];
  }
  const max = Math.max(M.net, M.bills), ceo = v('ceo', y);
  const row = (cls, label, val, text) => '<div class="g-row"><span>' + label + '</span><div class="g-bar ' + cls + '" style="width:' + Math.max(34, val / max * 100) + '%">' + text + '</div></div>';
  let h = '<div><div class="big">' + y + '</div>' + (y > YN ? '<span class="proj">Projection</span>' : '') + '</div>' +
    '<div class="head">' + HEADLINES[y] + '</div>';
  if (S.last) h += '<p class="small">' + S.last.year + ': <b class="' + (S.last.diff >= 0 ? 'up' : 'down') + '">' + signed(S.last.diff) + '</b>' + (S.last.late ? ' · ' + S.last.late + ' late fee' + (S.last.late > 1 ? 's' : '') : '') + (S.last.missed ? ' · ' + S.last.missed + ' pay packets missed' : '') + '</p>';
  h += '<div class="gauge"><p class="eyebrow">This year</p>' +
    row('pay', 'PAY', M.net, big(M.net) + (prev ? ' ' + pct(M.net / prev.net - 1) : '')) +
    row('bills', ch.rich ? 'YACHT' : 'BILLS', M.bills, big(M.bills) + (prev ? ' ' + pct(M.bills / prev.bills - 1) : '')) +
    (ceo && !ch.rich ? row('boss', 'BOSS', max, big(ceo) + ' → ' + Math.round(ceo / max).toLocaleString('en-GB') + ' screens wide') : '') + '</div>';
  if (first && !ch.rich) h += '<div class="legend">' +
    '<span class="lg coin">£</span><span><b>Catch your pay.</b> It drips from the boss’s vault.</span>' +
    '<span class="lg bill">RENT</span><span><b>Catch your bills.</b> Miss one and it costs 10% more.</span>' +
    '<span class="lg red">!</span><span><b>Dodge red letters.</b> They are never good news.</span>' +
    '<span class="lg hrt">♥</span><span><b>Hearts keep you going,</b> at a price. Run out and you burn out.</span></div>' +
    '<p class="small">Drag, or use the arrow keys. Go below your credit limit and it is over.</p>';
  if (first && ch.rich) h += '<p class="small">Your bucket is a yacht. Try not to exert yourself.</p>';
  if (S.offer) h += '<p class="eyebrow">Pick one, or neither</p><div class="perks">' + S.offer.map((id, i) => {
    const p = PERKS[id];
    return '<button class="perk" id="perk-' + i + '" type="button" aria-pressed="false"><b>' + p.name + '</b><span>' + p.line + '</span><em>' + (p.cost ? money(p.cost * ci) + ' now' : 'free') + (p.wb ? ' · ♥ ' + p.wb : '') + '</em></button>';
  }).join('') + '</div>';
  h += '<div class="btns"><button class="go" id="begin" type="button">Play ' + y + '</button></div>';
  const el = $('inter'); el.innerHTML = h; el.hidden = false; el.scrollTop = 0;
  $('hTick').textContent = HEADLINES[y]; hud();
  if (S.offer) S.offer.forEach((id, i) => $('perk-' + i).addEventListener('click', () => {
    S.pick = S.pick === i ? null : i;
    S.offer.forEach((_, j) => $('perk-' + j).setAttribute('aria-pressed', String(S.pick === j)));
  }));
  $('begin').addEventListener('click', () => begin());
}
function begin(){
  if (!S || G) return;
  if (S.offer && S.pick != null){
    const id = S.offer[S.pick], p = PERKS[id], ci = idx('cpi', S.year);
    S.perkUsed.push(id); S.perks.push(p.name); applyEff(p.eff);
    if (p.cost) S.bal -= p.cost * ci; if (p.wb) S.wb = Math.max(5, S.wb + p.wb);
  }
  S.offer = null; $('inter').hidden = true;
  resize(); G = setupYear(); hud(); beep(440, .12, 'triangle', .05, 2);
}

function newGame(ck){
  const ch = CH[ck];
  S = {ck, year:ch.y0 || Y0, bal:ch.start, wb:70, m:{pay:1, rent:1, energy:1, food:1, rest:1, fixed:0, drain:1, bucket:1, isa:0},
       perks:[], perkUsed:[], earned:0, giles:0, gYears:0, over:null, last:null, lastHit:'', offer:null, pick:null};

}

function rank(yrs){

  } else {
    stamp = first + ' lasted until ' + MONTHS[o.month - 1] + ' ' + y;
    line = (o.kind === 'bust' ? 'The credit ran out. Finished off by ' + o.cause + '. ' : 'Not the money in the end. Burnt out from ' + o.cause + '. ') + rank(yrs);
    share = 'I played Trickle Down as ' + first + ', ' + art + ' ' + ch.job.toLowerCase() + '. I lasted until ' + MONTHS[o.month - 1] + ' ' + y + '. Finished off by ' + o.cause + '.';
  }
  $('app').innerHTML =
    '<div class="stamp' + (o.kind === 'survived' ? ' win' : '') + '">' + stamp + '</div>' +
    '<p class="lede">' + line + '</p>' +
    (ch.rich ? '' : '<section class="card slip"><p class="eyebrow">Final statement, ' + y0 + ' to ' + y + (y > YN ? ' (later years projected)' : '') + '</p><dl class="lines">' +
    '<dt>Pay ' + first + ' caught, in total</dt><dd>' + big(S.earned) + '</dd>' +
    '<dt>' + gLabel + '</dt><dd>' + big(gTot) + '</dd>' +
    '<dt class="tot">Years ' + first + ' would need to work for that</dt><dd class="tot">' + Math.round(gTot / (Math.max(1, S.earned) / yrs)).toLocaleString('en-GB') + '</dd></dl></section>') +
    '<section class="card"><p class="eyebrow">Tell someone</p><p class="share" id="share">' + share + '</p>' +
    '<div class="btns"><button class="ghost" id="copy" type="button">Copy result</button></div></section>' +
    '<div class="btns"><button class="go" id="again" type="button">Play again</button>' +
    (ch.rich ? '' : '<button class="ghost" id="asgiles" type="button">Now play as the boss</button>') + '</div>' + sourcesHTML();
  $('again').addEventListener('click', () => { S = null; renderStart(); scrollTo(0, 0); });
  if (!ch.rich) $('asgiles').addEventListener('click', () => newGame('giles'));
  $('copy').addEventListener('click', () => {
    const done = () => { $('copy').textContent = 'Copied'; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('share')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent = 'Selected. Press copy'; };
    try { navigator.clipboard.writeText(share).then(done, fallback); } catch (e) { fallback(); }
  });
}

// ---- input and loop --------------------------------------------------
const toX = e => Math.max(0, Math.min(W, (e.clientX - cv.getBoundingClientRect().left) / scale));
cv.addEventListener('pointerdown', e => { e.preventDefault(); if (G) G.px = toX(e); });
cv.addEventListener('pointermove', e => { if (G) G.px = toX(e); });
const keys = {};
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight'){ keys[e.code] = 1; e.preventDefault(); }
  if ((e.code === 'Enter' || e.code === 'Space') && S && !G && !$('inter').hidden && !(e.target instanceof HTMLButtonElement)){ e.preventDefault(); begin(); }
});
addEventListener('keyup', e => { keys[e.code] = 0; });
$('mute').addEventListener('click', () => { meta.mute = !meta.mute; persist(); $('mute').textContent = meta.mute ? 'OFF' : 'SND'; });
$('mute').textContent = meta.mute ? 'OFF' : 'SND';

let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (G && !window.__tdManual){ G.key = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0); update(dt); if (G){ draw(); hud(); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__td = {v, idx, taxOn, CH, PERKS, W, get S(){ return S; }, get G(){ return G; }, newGame, begin, update, yearMoney, catchY, pick:i => { S.pick = i; }};
const boot = d => { if (d && d.S && d.S.m && !d.S.over){ S = d.S; $('app').hidden = true; $('stage').hidden = false; resize(); interlude(); } else renderStart(); };
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
